[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lord-of-the-components"
version = "0.1.0"
description = "Implementation-agnostic component system with c- prefixed tagnames"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lord of the Components" }
]
keywords = [
    "components",
    "design-system",
    "jinja2",
    "templates",
    "web-components",
    "ui-framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Framework :: Jinja",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/lord-of-the-components/lord-of-the-components"
Documentation = "https://lord-of-the-components.dev"
Repository = "https://github.com/lord-of-the-components/lord-of-the-components"
Issues = "https://github.com/lord-of-the-components/lord-of-the-components/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-beautifulsoup4>=4.12.0",
]
flask = [
    "flask>=2.0.0",
]
django = [
    "django>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/src/lord_of_the_components"]

[tool.hatch.build.targets.sdist]
include = [
    "/python/src",
    "/python/tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
