[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotc-bgnldd"
version = "0.1.0"
description = "BGNLDD component layer for Lord of the Components — Begane Grond's app components (sidenav, metric, layer, …) built on top of NLDD, as a mix-and-match theme"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "lord-of-the-components",
    "lotc-nldd",
]

# Core discovers this design system via the entry-point group.
[project.entry-points."lord_of_the_components.design_systems"]
bgnldd = "lotc_bgnldd:DESIGN_SYSTEM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotc_bgnldd = ["templates/**/*.j2", "static/**/*", "registry.json"]
