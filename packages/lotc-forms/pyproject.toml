[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotc-forms"
version = "0.1.0"
description = "Opt-in form-field set (labelled fields + aria wiring) for Lord of the Components — renders per active theme."
requires-python = ">=3.9"

# Discovered by core; activate LAST, after the visual theme:
#   setup_components(design_systems=["lotc-layout", "nldd", "lotc-forms"])
[project.entry-points."lord_of_the_components.design_systems"]
lotc-forms = "lotc_forms:DESIGN_SYSTEM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotc_forms = ["templates/**/*.j2", "static/**/*", "registry.json"]
