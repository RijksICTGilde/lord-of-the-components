<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>Feedback components</title></head>
<body>
  <c-heading type="h2">Tags</c-heading>
  <c-layout-flow gap="sm" row wrap>
    <c-tag type="default">Standaard</c-tag>
    <c-tag type="info">Info</c-tag>
    <c-tag type="success">Gelukt</c-tag>
    <c-tag type="warning">Let op</c-tag>
    <c-tag type="error">Fout</c-tag>
  </c-layout-flow>

  <c-heading type="h2">Badges</c-heading>
  <c-layout-flow gap="sm" row wrap>
    <c-badge type="default" label="1"/>
    <c-badge type="info" label="2"/>
    <c-badge type="success" label="3"/>
    <c-badge type="warning" label="8"/>
    <c-badge type="error" label="99"/>
  </c-layout-flow>
</body></html>
