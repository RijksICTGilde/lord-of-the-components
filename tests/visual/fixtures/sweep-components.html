<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>Sweep components</title></head>
<body>
  <c-heading type="h2">Form inputs (batch B)</c-heading>
  <c-layout-flow gap="md">
    <c-text-input name="email" type="email" placeholder="naam@voorbeeld.nl"/>
    <c-text-input name="disabled" value="Uitgeschakeld" disabled/>
    <c-textarea name="bericht" placeholder="Typ een bericht..."/>
  </c-layout-flow>
  <c-heading type="h2">Basic HTML (batch D)</c-heading>
  <c-paragraph>Een paragraaf met <c-b>bold</c-b>, <c-i>italic</c-i>, <c-code>inline code</c-code> en <c-small>small print</c-small>.</c-paragraph>
  <c-blockquote>Een blockquote met een citaat.</c-blockquote>
  <c-hr/>
  <c-div class="rvo-margin-block-start--md">Een div-container met margin utility.</c-div>
</body></html>
