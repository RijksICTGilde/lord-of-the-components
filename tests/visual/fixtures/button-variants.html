<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Variants</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 1rem; margin: 0; }
        .fixture-container { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
        .fixture-group { margin-bottom: 2rem; }
        .fixture-group h3 { margin: 0 0 0.5rem; font-size: 0.875rem; color: #666; }
    </style>
</head>
<body>
    <div class="fixture-container">
        <div class="fixture-group">
            <h3>Type variants</h3>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <c-button type="primary" label="Primary"/>
                <c-button type="secondary" label="Secondary"/>
                <c-button type="tertiary" label="Tertiary"/>
                <c-button type="quaternary" label="Quaternary"/>
                <c-button type="subtle" label="Subtle"/>
                <c-button type="warning" label="Warning"/>
                <c-button type="warning-subtle" label="Warning Subtle"/>
            </div>
        </div>

        <div class="fixture-group">
            <h3>Sizes</h3>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <c-button size="xs" label="Extra Small"/>
                <c-button size="sm" label="Small"/>
                <c-button size="md" label="Medium"/>
            </div>
        </div>

        <div class="fixture-group">
            <h3>States</h3>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <c-button label="Normal"/>
                <c-button label="Disabled" disabled/>
                <c-button label="Active" active/>
                <c-button label="Loading" loading/>
                <c-button label="Full Width" full-width/>
            </div>
        </div>

        <div class="fixture-group">
            <h3>With icons</h3>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <c-button label="Icon Before" show-icon="before" icon="delta-naar-rechts"/>
                <c-button label="Icon After" show-icon="after" icon="delta-naar-rechts"/>
            </div>
        </div>

        <div class="fixture-group">
            <h3>Content override</h3>
            <div style="display: flex; gap: 0.5rem;">
                <c-button>Custom <strong>content</strong></c-button>
            </div>
        </div>

        <div class="fixture-group">
            <h3>Form submit</h3>
            <div style="display: flex; gap: 0.5rem;">
                <c-button html-type="submit" label="Submit"/>
                <c-button html-type="reset" label="Reset"/>
            </div>
        </div>
    </div>
</body>
</html>
