<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>App shell</title>
<style>
  /* Demo-only: tint the shell regions so the grid areas are visible. */
  body { margin: 0; }
  .lotc-app-shell__header { background: #154273; color: #fff; padding: 1rem 1.5rem; }
  .lotc-app-shell__sidebar { background: #e6eaf0; padding: 1.5rem; }
  .lotc-app-shell__main { padding: 1.5rem; }
  .lotc-app-shell__footer { background: #f3f3f3; padding: 1rem 1.5rem; border-top: 1px solid #ccc; }
  .lotc-app-shell__sidebar a { display: block; margin-bottom: .5rem; }
</style>
</head>
<body>
  <c-app-shell width="14rem">
    <template slot="header">
      <c-heading type="h3" class="rvo-margin-block--none">Mijn Applicatie</c-heading>
    </template>
    <template slot="sidebar">
      <c-link href="#">Dashboard</c-link>
      <c-link href="#">Aanvragen</c-link>
      <c-link href="#">Documenten</c-link>
      <c-link href="#">Instellingen</c-link>
    </template>

    <c-heading type="h2">Overzicht</c-heading>
    <!-- Cross-theme-safe content: heading/paragraph/button have both an RVO and
         an NLDD implementation, so the shell demo renders in both themes. Cards
         are RVO-only, so they are not used here. -->
    <c-auto-grid min="14rem" gap="1rem">
      <c-stack gap="0.25rem"><c-heading type="h3">Aanvragen</c-heading><c-paragraph no-spacing>12 open</c-paragraph></c-stack>
      <c-stack gap="0.25rem"><c-heading type="h3">Documenten</c-heading><c-paragraph no-spacing>34 bestanden</c-paragraph></c-stack>
      <c-stack gap="0.25rem"><c-heading type="h3">Berichten</c-heading><c-paragraph no-spacing>5 ongelezen</c-paragraph></c-stack>
      <c-stack gap="0.25rem"><c-heading type="h3">Taken</c-heading><c-paragraph no-spacing>3 vandaag</c-paragraph></c-stack>
    </c-auto-grid>

    <template slot="footer">
      <c-paragraph no-spacing>© 2026 Mijn Organisatie</c-paragraph>
    </template>
  </c-app-shell>
</body></html>
