<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card - Card with Header and Footer</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="card" data-example="with-header-footer">
        <c-card><template #header><h3>Card Title</h3></template><p>Main content area.</p><template #footer><c-button variant="ghost">Action</c-button></template></c-card>
    </div>
</body>
</html>
