<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Accordion</title></head><body>
<c-heading type="h2">Accordion</c-heading>
<c-accordion>
  <c-accordion-item title="Wat is ZAD?" open>
    <c-paragraph>ZAD is een selfservice-portaal waarin ontwikkelaars infrastructuur declareren in YAML.</c-paragraph>
  </c-accordion-item>
  <c-accordion-item title="Hoe voeg ik een service toe?">
    <c-paragraph>Via de wizard of de API voeg je een service toe aan je project.</c-paragraph>
  </c-accordion-item>
  <c-accordion-item title="Waar staan mijn projecten?">
    <c-paragraph>Elk project is een YAML-bestand in de zad-projects git repository.</c-paragraph>
  </c-accordion-item>
</c-accordion>
</body></html>
