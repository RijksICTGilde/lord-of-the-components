<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Variants</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 1rem; margin: 0; }
        .fixture-container { display: flex; flex-direction: column; gap: 1.5rem; }
        .fixture-group { margin-bottom: 0.5rem; }
        .fixture-group h3 { margin: 0 0 0.5rem; font-size: 0.875rem; color: #666; }
    </style>
</head>
<body>
    <div class="fixture-container">
        <!-- Basic horizontal menu -->
        <div class="fixture-group">
            <h3>Menu - Horizontal (default)</h3>
            <c-menu>
                <c-menu-item label="Home" href="/"/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Diensten" href="/services"/>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <!-- Menu with active item -->
        <div class="fixture-group">
            <h3>Menu - Active Item</h3>
            <c-menu>
                <c-menu-item label="Home" href="/" active/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Diensten" href="/services"/>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <!-- Menu with icons -->
        <div class="fixture-group">
            <h3>Menu - With Icons</h3>
            <c-menu>
                <c-menu-item label="Home" href="/" icon="home"/>
                <c-menu-item label="Instellingen" href="/settings" icon="instellingen"/>
                <c-menu-item label="Help" href="/help" icon="info"/>
            </c-menu>
        </div>

        <!-- Menu with submenu -->
        <div class="fixture-group">
            <h3>Menu - With Submenu</h3>
            <c-menu>
                <c-menu-item label="Home" href="/"/>
                <c-menu-item label="Producten">
                    <c-menu-item label="Widget A" href="/products/a"/>
                    <c-menu-item label="Widget B" href="/products/b"/>
                    <c-menu-item label="Widget C" href="/products/c"/>
                </c-menu-item>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <!-- Vertical menu -->
        <div class="fixture-group">
            <h3>Menu - Vertical</h3>
            <c-menu type="vertical">
                <c-menu-item label="Home" href="/"/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Diensten" href="/services" active/>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <!-- Size variants -->
        <div class="fixture-group">
            <h3>Menu - Size SM</h3>
            <c-menu size="sm">
                <c-menu-item label="Home" href="/"/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <div class="fixture-group">
            <h3>Menu - Size LG</h3>
            <c-menu size="lg">
                <c-menu-item label="Home" href="/"/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>

        <!-- Menu with aria-label -->
        <div class="fixture-group">
            <h3>Menu - With Aria Label</h3>
            <c-menu aria-label="Hoofdnavigatie">
                <c-menu-item label="Home" href="/" icon="home" active/>
                <c-menu-item label="Over ons" href="/about"/>
                <c-menu-item label="Diensten">
                    <c-menu-item label="Advies" href="/services/advies"/>
                    <c-menu-item label="Ondersteuning" href="/services/support"/>
                </c-menu-item>
                <c-menu-item label="Contact" href="/contact"/>
            </c-menu>
        </div>
    </div>
</body>
</html>
