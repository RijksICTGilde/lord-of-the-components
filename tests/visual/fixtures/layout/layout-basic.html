<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Basic Layout</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="basic">
        <c-layout><h1>Page Title</h1><p>Main content goes here.</p></c-layout>
    </div>
</body>
</html>
