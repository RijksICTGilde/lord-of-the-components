<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Left Sidebar Layout</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="sidebar-left">
        <c-layout variant="sidebar-left"><template #sidebar><nav><ul><li><a href="/">Home</a></li></ul></nav></template><article><h1>Article Title</h1></article></c-layout>
    </div>
</body>
</html>
