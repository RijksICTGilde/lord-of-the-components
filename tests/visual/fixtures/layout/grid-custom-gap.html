<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid - Custom Gaps</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="grid" data-example="custom-gap">
        <c-grid cols="3" gapX="lg" gapY="sm"><div>Item 1</div><div>Item 2</div><div>Item 3</div></c-grid>
    </div>
</body>
</html>
