<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - Horizontal Stack</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="stack" data-example="horizontal">
        <c-stack direction="horizontal" gap="lg"><button>Action 1</button><button>Action 2</button><button>Action 3</button></c-stack>
    </div>
</body>
</html>
