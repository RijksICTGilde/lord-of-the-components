<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Holy Grail Layout</title>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="holy-grail">
        <c-layout variant="holy-grail"><template #header><header>Site Header</header></template><template #sidebar><aside>Sidebar</aside></template><main>Main Content</main><template #footer><footer>Site Footer</footer></template></c-layout>
    </div>
</body>
</html>
