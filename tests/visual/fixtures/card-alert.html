<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><title>Card + Alert</title></head><body>
<c-heading type="h2">Card</c-heading>
<c-card title="Aanvragen" href="#">Bekijk en beheer je openstaande aanvragen.</c-card>
<c-heading type="h2">Alert</c-heading>
<c-alert type="info" heading="Ter info">Een informatief bericht.</c-alert>
<c-alert type="warning" heading="Let op">Controleer je invoer.</c-alert>
<c-alert type="success" heading="Gelukt">Opgeslagen.</c-alert>
</body></html>
