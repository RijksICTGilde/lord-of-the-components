<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>Stack</title></head>
<body>
  <c-heading type="h2">Stack — direction="vertical"</c-heading>
  <c-stack direction="vertical" gap="0.5rem" align="start">
    <c-button type="primary" label="Eerste"/>
    <c-button type="secondary" label="Tweede"/>
    <c-button type="secondary" label="Derde"/>
  </c-stack>

  <c-heading type="h2">Stack — direction="horizontal"</c-heading>
  <c-stack direction="horizontal" gap="0.5rem" align="center">
    <c-button type="primary" label="Eerste"/>
    <c-button type="secondary" label="Tweede"/>
    <c-button type="secondary" label="Derde"/>
  </c-stack>
</body></html>
