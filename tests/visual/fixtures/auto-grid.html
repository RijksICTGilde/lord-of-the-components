<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><title>Auto grid</title></head>
<body>
  <c-heading type="h2">Responsive auto-grid (min 16rem)</c-heading>
  <c-paragraph>Kolommen vullen de breedte; het aantal past zich vanzelf aan.</c-paragraph>
  <c-auto-grid min="16rem" gap="1rem">
    <c-card title="Kaart 1">Inhoud van de eerste kaart.</c-card>
    <c-card title="Kaart 2">Inhoud van de tweede kaart.</c-card>
    <c-card title="Kaart 3">Inhoud van de derde kaart.</c-card>
    <c-card title="Kaart 4">Inhoud van de vierde kaart.</c-card>
    <c-card title="Kaart 5">Inhoud van de vijfde kaart.</c-card>
    <c-card title="Kaart 6">Inhoud van de zesde kaart.</c-card>
  </c-auto-grid>
</body></html>
