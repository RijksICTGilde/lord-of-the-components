<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - Space Between (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
            width: 100%;
        }
        .c-stack {
            display: flex;
            width: 100%;
        }
        .c-stack[data-direction="horizontal"] {
            flex-direction: row;
        }
        .c-stack[data-justify="space-between"] {
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="stack" data-example="space-between">
        <div class="c-stack" data-direction="horizontal" data-justify="space-between" data-align="stretch">
            <span>Left</span>
            <span>Center</span>
            <span>Right</span>
        </div>
    </div>
</body>
</html>
