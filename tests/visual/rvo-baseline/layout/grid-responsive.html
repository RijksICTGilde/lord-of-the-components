<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid - Responsive Grid (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-grid {
            display: grid;
        }
        .c-grid[data-cols="4"] {
            grid-template-columns: repeat(4, 1fr);
        }
        .c-grid[data-gap="lg"] {
            gap: 1.5rem;
        }
        .c-grid__item {
            padding: 1rem;
            background: #f0f0f0;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="grid" data-example="responsive">
        <div class="c-grid" data-cols="4" data-gap="lg">
            <div class="c-grid__item">Card 1</div>
            <div class="c-grid__item">Card 2</div>
            <div class="c-grid__item">Card 3</div>
            <div class="c-grid__item">Card 4</div>
        </div>
    </div>
</body>
</html>
