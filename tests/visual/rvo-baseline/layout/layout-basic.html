<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Basic Layout (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-layout {
            max-width: 1024px;
            margin: 0 auto;
            padding: 1rem;
        }
        h1 {
            margin: 0 0 0.5rem 0;
        }
        p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="basic">
        <div class="c-layout" data-variant="default" data-max-width="lg" data-padding="md">
            <div class="c-layout__main">
                <h1>Page Title</h1>
                <p>Main content goes here.</p>
            </div>
        </div>
    </div>
</body>
</html>
