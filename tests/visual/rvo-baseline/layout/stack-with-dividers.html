<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - Stack with Dividers (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-stack {
            display: flex;
        }
        .c-stack[data-direction="vertical"] {
            flex-direction: column;
        }
        .c-stack[data-dividers="true"] > *:not(:last-child) {
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="stack" data-example="with-dividers">
        <div class="c-stack" data-direction="vertical" data-dividers="true" data-gap="md" data-align="stretch">
            <div>Section 1</div>
            <div>Section 2</div>
            <div>Section 3</div>
        </div>
    </div>
</body>
</html>
