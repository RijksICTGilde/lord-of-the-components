<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - Vertical Stack (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-stack {
            display: flex;
        }
        .c-stack[data-direction="vertical"] {
            flex-direction: column;
        }
        .c-stack[data-gap="md"] {
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="stack" data-example="vertical">
        <div class="c-stack" data-direction="vertical" data-gap="md" data-align="stretch">
            <div>First item</div>
            <div>Second item</div>
            <div>Third item</div>
        </div>
    </div>
</body>
</html>
