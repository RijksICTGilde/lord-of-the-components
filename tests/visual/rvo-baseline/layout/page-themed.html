<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        body.theme-dark {
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        h1 {
            margin: 0 0 0.5rem 0;
        }
        p {
            margin: 0;
        }
    </style>
</head>
<body class="theme-dark" data-component="page" data-example="themed" data-theme="dark">
    <h1>Dark Theme</h1>
    <p>This page uses the dark theme.</p>
</body>
</html>
