<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Left Sidebar Layout (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            max-width: 1024px;
            margin: 0 auto;
            padding: 1rem;
            gap: 1rem;
        }
        .c-layout__sidebar {
            border-right: 1px solid #ddd;
            padding-right: 1rem;
        }
        .c-layout__sidebar nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .c-layout__sidebar nav ul li {
            margin-bottom: 0.5rem;
        }
        .c-layout__sidebar nav ul li a {
            color: #0077cc;
            text-decoration: none;
        }
        h1 {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="sidebar-left">
        <div class="c-layout" data-variant="sidebar-left" data-max-width="lg" data-padding="md">
            <aside class="c-layout__sidebar">
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                    </ul>
                </nav>
            </aside>
            <main class="c-layout__main">
                <article>
                    <h1>Article Title</h1>
                </article>
            </main>
        </div>
    </div>
</body>
</html>
