<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stack - Wrapping Stack (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-stack {
            display: flex;
        }
        .c-stack[data-direction="horizontal"] {
            flex-direction: row;
        }
        .c-stack[data-wrap="true"] {
            flex-wrap: wrap;
        }
        .c-stack[data-gap="sm"] {
            gap: 0.5rem;
        }
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: #e0e0e0;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="stack" data-example="wrapping">
        <div class="c-stack" data-direction="horizontal" data-gap="sm" data-wrap="true" data-align="stretch">
            <span class="tag">Tag 1</span>
            <span class="tag">Tag 2</span>
            <span class="tag">Tag 3</span>
        </div>
    </div>
</body>
</html>
