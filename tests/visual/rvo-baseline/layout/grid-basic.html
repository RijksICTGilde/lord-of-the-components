<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid - Basic Grid (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-grid {
            display: grid;
        }
        .c-grid[data-cols="3"] {
            grid-template-columns: repeat(3, 1fr);
        }
        .c-grid[data-gap="md"] {
            gap: 1rem;
        }
        .c-grid__item {
            padding: 1rem;
            background: #f0f0f0;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="grid" data-example="basic">
        <div class="c-grid" data-cols="3" data-gap="md">
            <div class="c-grid__item">Item 1</div>
            <div class="c-grid__item">Item 2</div>
            <div class="c-grid__item">Item 3</div>
            <div class="c-grid__item">Item 4</div>
            <div class="c-grid__item">Item 5</div>
            <div class="c-grid__item">Item 6</div>
        </div>
    </div>
</body>
</html>
