<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout - Layout with Header and Footer (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-layout {
            display: flex;
            flex-direction: column;
            max-width: 1024px;
            margin: 0 auto;
            padding: 1rem;
            gap: 1rem;
        }
        .c-layout__header {
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
        }
        .c-layout__footer {
            border-top: 1px solid #ddd;
            padding-top: 1rem;
        }
        h1 {
            margin: 0 0 0.5rem 0;
        }
        p {
            margin: 0;
        }
        nav {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="layout" data-example="with-header-footer">
        <div class="c-layout" data-variant="default" data-max-width="lg" data-padding="md">
            <header class="c-layout__header">
                <nav>Navigation here</nav>
            </header>
            <main class="c-layout__main">
                <h1>Welcome</h1>
                <p>Main content area.</p>
            </main>
            <footer class="c-layout__footer">
                <p>2024 Company Name</p>
            </footer>
        </div>
    </div>
</body>
</html>
