<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button - Buttons with Icons (RVO Baseline)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
        }
        .fixture-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
        .c-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #0077cc;
            color: white;
            gap: 0.5rem;
        }
        .c-button__icon {
            display: inline-flex;
            width: 1em;
            height: 1em;
        }
        .c-button__icon svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="fixture-container" data-component="button" data-example="with-icons">
        <button type="button" class="c-button" data-variant="primary" data-size="md">
            <span class="c-button__icon c-button__icon--before" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </span>
            <span class="c-button__label">Download</span>
        </button>
    </div>
</body>
</html>
